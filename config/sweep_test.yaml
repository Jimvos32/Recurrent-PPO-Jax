defaults:
  - _self_
  - task: variable
  - trainer: variable_ppo
  - experiment: combos   # loads config/experiment/combos.yaml
  - function_params: funcs  # loads config/function_params/variable.yaml
  - norm_flow: norm_flow # loads config/norm_flow/standard_bijections.yaml
# Default experiment selection (can be overridden on the CLI)
experiment:
  choice: test_neg_abs


# Global settings
tags: null
project_name: ${experiment.combos.${experiment.choice}.project_name}
run_name: ""
seed: 77
steps: ${experiment.combos.${experiment.choice}.steps}
log_interval: 8000
eval_episodes: 20
eval_interval: 20000
use_wandb: false
root_dir: your_path

