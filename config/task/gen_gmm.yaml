name: gen_gmm
task: gen_gmm
env: cosine
bounds: [-5, 5]
# These keys are set from the experiment combos:
batches: ${experiment.combos.${experiment.choice}.batches}
max_episode_steps: ${experiment.combos.${experiment.choice}.max_episode_steps}
total_episode_samples: 40
action_dim: 1
degree: 2
rank: 2
num_oscillations: 5
random: true
batch_expand_hidden: [128, 64]
batch_combine_hidden: [128, 64]
step_expand_hidden: [128, 64]
input_combine_hidden: [128, 64]
tag: no_tag