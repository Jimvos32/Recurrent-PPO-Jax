agent: ppo
d_actor: [128, 64, 32]
lstm_seqential: [64,64]
recon_hidden: [64, 64]
actor_params_hidden: [64, 32]
decoder_params_hidden: [64, 32]
latent_dim: 6
d_critic: 128
num_envs: 8
rollout_len: 256
sequence_length: null
gamma: 0.99
gae_lambda: 0.95
num_minibatches: 8
update_epochs: 4
norm_adv: false
clip_coef: 0.1
vae: false
dist_model: standard

sample_distribution: 4

ent_coef: 
  initial: 0.3
  final: 0.0
  max_decay_steps: 1000
  power: 1

stability_coef: 
  initial: 0.06
  final: 0
  max_decay_steps: 1000
  power: 2

vf_coef: 0.4
max_grad_norm: 0.5
optimizer: 
  learning_rate: 
    initial: 2.5e-4
    final: null
    max_decay_steps: 1000
    power: 1
defaults:
  - _self_
  - seq_model: lstm